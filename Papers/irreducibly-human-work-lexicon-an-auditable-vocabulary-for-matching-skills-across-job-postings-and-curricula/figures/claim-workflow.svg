<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="327" viewBox="0 0 1040 327" role="img" aria-labelledby="title desc">
<title id="title">From a label to a reviewable claim</title><desc id="desc">Illustrative pipeline from source mention to candidate concept to claim-level review; ambiguity can remain undecided.</desc>
<rect width="1040" height="327" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#202a37">
<text x="34" y="47" font-size="34" fill="#202a37" font-weight="700">From a label to a reviewable claim</text>
<rect x="34" y="85" width="300" height="128" rx="5" fill="#edf5f6" stroke="#61929b"/>
<text x="50" y="120" font-size="24" fill="#202a37" font-weight="700">1. Source mention</text>
<text x="50" y="158" font-size="21" fill="#202a37" font-weight="400">A posting asks for</text>
<text x="50" y="186" font-size="21" fill="#202a37" font-weight="400">Postgres.</text>
<rect x="370" y="85" width="300" height="128" rx="5" fill="#edf5f6" stroke="#61929b"/>
<text x="386" y="120" font-size="24" fill="#202a37" font-weight="700">2. Concept candidate</text>
<text x="386" y="158" font-size="21" fill="#202a37" font-weight="400">Postgres may name</text>
<text x="386" y="186" font-size="21" fill="#202a37" font-weight="400">the PostgreSQL database.</text>
<rect x="706" y="85" width="300" height="128" rx="5" fill="#edf5f6" stroke="#61929b"/>
<text x="722" y="120" font-size="24" fill="#202a37" font-weight="700">3. Claim decision</text>
<text x="722" y="158" font-size="21" fill="#202a37" font-weight="400">Check the alias in context;</text>
<text x="722" y="186" font-size="21" fill="#202a37" font-weight="400">record the source and result.</text>
<line x1="339" y1="148" x2="357" y2="148" stroke="#164f64" stroke-width="3"/><polygon points="364,148 355,142 355,154" fill="#164f64"/>
<line x1="675" y1="148" x2="693" y2="148" stroke="#164f64" stroke-width="3"/><polygon points="700,148 691,142 691,154" fill="#164f64"/>
<text x="34" y="264" font-size="23" fill="#202a37" font-weight="400">If the context does not resolve the meaning, leave the match undecided.</text>
<text x="34" y="297" font-size="23" fill="#202a37" font-weight="700">A verified alias is not proof of proficiency, prevalence, or a reviewed entry.</text></g></svg>
